<style>
:root{

}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:400 17px/1.4 var(--sys);-webkit-font-smoothing:antialiased;

main{max-width:420px;margin:0 auto}
.top{position:relative;height:141px}
.pf{position:absolute;top:0;left:0;z-index:2;margin:0}
.pf a{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;background:var(--ink);color:#fff;font:600 15px var(--sys);text-decoration:none}
.point{position:absolute;top:12px;left:108px;width:246px;z-index:0;pointer-events:none}
.stage{position:relative;z-index:1;margin-top:-8px}
.sp{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffe7a8;box-shadow:0 0 6px 2px rgba(255,205,110,.85);animation:tw 2.4s ease-in-out infinite}
.sp.s1{left:2px;top:-6px}.sp.s2{left:30px;top:10px;width:4px;height:4px;animation-delay:.6s}.sp.s3{left:118px;top:70px;animation-delay:1.1s}.sp.s4{left:96px;top:96px;width:4px;height:4px;animation-delay:1.7s}.sp.s5{left:228px;top:42px;width:5px;height:5px;animation-delay:.9s}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){.sp{animation:none;opacity:.8}}
.lang{position:absolute;top:0;right:0;z-index:2;min-height:36px;min-width:56px;padding:0 14px;border:0;border-radius:999px;background:rgba(255,255,255,.75);color:var(--ink);font:600 15px var(--sys);cursor:pointer}
.top{direction:ltr}
.t b{font-weight:inherit}
html[lang=ar] body{font-family:"SF Arabic","Segoe UI",Tahoma,var(--sys)}
html[lang=ar] .eyebrow{letter-spacing:0}
html:not([lang=ar]) .ar{display:none}
html[lang=ar] h1{display:none}
html[lang=ar] .ar{font-size:40px;margin-top:8px}
.point img{display:block;width:100%;height:auto}
.card{position:relative;z-index:1;background:var(--card);border-radius:22px;padding:22px 18px 16px;box-shadow:0 1px 0 rgba(0,0,0,.04),0 18px 40px -22px rgba(40,30,10,.45)}
.eyebrow{margin:0;font:600 13px var(--sys);letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.ar{margin:10px 0 0;font:700 32px/1.2 'Aref Ruqaa',serif;color:var(--gold)}
h1{margin:2px 0 4px;font:400 40px/1.05 'Instrument Serif',serif;letter-spacing:-.01em}
.role{margin:0 0 16px;color:var(--mute);font-size:15px}
.list{list-style:none;margin:0;padding:0;border-radius:14px;background:#f6f2ea;overflow:hidden}
.list li+li a{border-top:.5px solid var(--sep)}
.list a{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 14px;color:var(--ink);text-decoration:none}
.list .t{flex:1;font:500 17px var(--sys)}
.list .t small{display:block;font:400 13px var(--sys);color:var(--mute)}
.btn{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:76px;height:32px;padding:0 12px;border-radius:999px;background:rgba(47,95,179,.12);color:var(--tint);font:600 15px var(--sys)}
.wa{display:flex;align-items:center;gap:12px;margin:14px 0 0;min-height:56px;padding:10px 14px;border-radius:14px;background:var(--wa);color:#fff;text-decoration:none}
.wa svg{width:26px;height:26px;fill:#fff;flex:none}
.wa .t{flex:1;font:600 17px var(--sys)}
.wa .t small{display:block;font:500 14px var(--sys);opacity:.9;direction:ltr}
.wa .go{font:600 15px var(--sys);padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.2)}
.foot{margin:12px 2px 0;font-size:13px;color:var(--mute);display:flex;gap:16px;flex-wrap:wrap}
.foot a{color:var(--tint);text-decoration:none}
a:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
@media (hover:hover){.list a:hover{background:rgba(0,0,0,.03)}.wa:hover{filter:brightness(1.05)}}
@media (max-width:360px){h1{font-size:34px}.point{width:210px}.top{height:126px}}
</style>
</head>

<script>
(function(){
  var els=[].slice.call(document.querySelectorAll('[data-ar]'));
  els.forEach(function(e){e.setAttribute('data-en',e.textContent)});
  var btn=document.getElementById('lang'), card=document.querySelector('.card');
  function set(l){
    els.forEach(function(e){e.textContent=e.getAttribute(l==='ar'?'data-ar':'data-en')});
    document.documentElement.lang=l; card.dir=l==='ar'?'rtl':'ltr';
    btn.textContent=l==='ar'?'English':'عربي'; btn.lang=l==='ar'?'en':'ar';
    try{localStorage.setItem('coop-lang',l)}catch(e){}
  }
  btn.addEventListener('click',function(){set(document.documentElement.lang==='ar'?'en':'ar')});
  var saved=null; try{saved=localStorage.getItem('coop-lang')}catch(e){}
  if(saved==='ar')set('ar');
})();
</script>
